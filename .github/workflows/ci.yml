name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sdk:
    name: SDK · build + test (iOS Simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + test
        run: |
          # Don't hardcode a simulator name — the runner image's device set
          # changes with Xcode, and a missing name fails with "Unable to find a
          # device matching the provided destination specifier". Pick whatever
          # booted-capable iPhone the image actually ships.
          SIM=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; ds=json.load(sys.stdin)['devices']; print(next(d['name'] for rt in sorted(ds) if 'iOS' in rt for d in ds[rt] if d['name'].startswith('iPhone')))")
          echo "Using simulator: $SIM"
          xcodebuild test \
            -scheme AddressIQ \
            -destination "platform=iOS Simulator,name=$SIM" \
            CODE_SIGNING_ALLOWED=NO

  example:
    name: Example · build (local SDK)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4
      # Consumes the local SDK via `.package(path: "..")`.
      - name: Build
        run: |
          xcodebuild build \
            -scheme AddressIQSample \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
